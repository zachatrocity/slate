services:
  slate:
    build: .
    image: slate:local
    restart: unless-stopped
    init: true
    environment:
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?Set PUBLISH_TOKEN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - slate_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  slate_data:
